source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 1000
source [find target/stm32f1x.cfg]
init
# Read running target without reset, halt, firmware writes or counter resets.
dump_image build/performance-20261102/flash.bin 0x08000000 65536
echo "CPUID [read_memory 0xE000ED00 32 1]"
echo "RCC_CFGR [read_memory 0x40021004 32 1]"
echo "TIM2_PSC_ARR [read_memory 0x40000028 32 2]"
echo "TIM3_PSC_ARR [read_memory 0x40000428 32 2]"
echo "CAN_BTR [read_memory 0x4000641c 32 1]"
echo "CAN_ESR [read_memory 0x40006418 32 1]"
echo "GPIOA_ODR [read_memory 0x4001080c 32 1]"
echo "ADC_T0 [read_memory 0x2000051c 32 12]"
echo "MILLIS_T0 [read_memory 0x2000056c 32 1]"
sleep 5000
echo "ADC_T1 [read_memory 0x2000051c 32 12]"
echo "MILLIS_T1 [read_memory 0x2000056c 32 1]"
shutdown
